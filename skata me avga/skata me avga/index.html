<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fire Cuts — 3D Model</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080808;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Georgia', serif;
    overflow: hidden;
  }
  #canvas-wrap {
    width: 100vw; height: 100vh;
    position: relative;
  }
  canvas { display: block; }

  .label {
    position: absolute; bottom: 40px; left: 50%;
    transform: translateX(-50%);
    text-align: center; pointer-events: none;
  }
  .label h1 {
    font-size: 13px; letter-spacing: 6px;
    text-transform: uppercase; color: #c9a84c;
    opacity: 0; animation: fadeIn 1s 1.5s forwards;
  }
  .label p {
    font-size: 11px; letter-spacing: 3px;
    color: rgba(255,255,255,0.3); margin-top: 8px;
    opacity: 0; animation: fadeIn 1s 2s forwards;
  }

  .loading {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #080808; z-index: 10;
    transition: opacity 0.8s ease;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
  .loading-ring {
    width: 60px; height: 60px;
    border: 1px solid rgba(201,168,76,0.2);
    border-top-color: #c9a84c;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .loading-text {
    margin-top: 20px; font-size: 11px;
    letter-spacing: 4px; color: #c9a84c;
    text-transform: uppercase;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { to { opacity: 1; } }

  /* Particle canvas behind */
  #particles {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
  }
  #main-canvas { position: absolute; inset: 0; z-index: 1; }
</style>
</head>
<body>

<div id="canvas-wrap">
  <canvas id="particles"></canvas>
  <canvas id="main-canvas"></canvas>
  <div class="label">
    <h1>Fire Cuts — Precision Tools</h1>
    <p>Drag to rotate · Scroll to zoom</p>
  </div>
  <div class="loading" id="loading">
    <div class="loading-ring"></div>
    <div class="loading-text">Loading...</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// PARTICLES BG
const pCanvas = document.getElementById('particles');
const pCtx = pCanvas.getContext('2d');
pCanvas.width = window.innerWidth;
pCanvas.height = window.innerHeight;

const particles = Array.from({ length: 80 }, () => ({
  x: Math.random() * pCanvas.width,
  y: Math.random() * pCanvas.height,
  r: Math.random() * 1.5 + 0.3,
  dx: (Math.random() - 0.5) * 0.3,
  dy: (Math.random() - 0.5) * 0.3,
  alpha: Math.random() * 0.5 + 0.1
}));

function drawParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  particles.forEach(p => {
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pCtx.fillStyle = `rgba(201,168,76,${p.alpha})`;
    pCtx.fill();
    p.x += p.dx; p.y += p.dy;
    if (p.x < 0 || p.x > pCanvas.width) p.dx *= -1;
    if (p.y < 0 || p.y > pCanvas.height) p.dy *= -1;
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

// THREE.JS SCENE
const canvas = document.getElementById('main-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0, 0.5, 3);

// LIGHTS
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xfff5e0, 2.5);
keyLight.position.set(2, 3, 2);
keyLight.castShadow = true;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xc9a84c, 1.0);
fillLight.position.set(-3, 1, -1);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 1.5);
rimLight.position.set(0, -2, -3);
scene.add(rimLight);

const pointLight = new THREE.PointLight(0xc9a84c, 2, 8);
pointLight.position.set(0, 2, 1);
scene.add(pointLight);

// ORBIT CONTROLS
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 0.5;
controls.maxDistance = 8;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.5;
controls.enablePan = false;

// LOAD GLB
const loader = new GLTFLoader();
let model = null;
let mixer = null;
let floatTime = 0;

loader.load(
  'salon_clippers.glb',
  (gltf) => {
    model = gltf.scene;

    // Center and scale model
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 2.0 / maxDim;
    model.scale.setScalar(scale);
    model.position.sub(center.multiplyScalar(scale));

    // Enhance materials
    model.traverse(child => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        if (child.material) {
          child.material.envMapIntensity = 1.5;
          if (child.material.metalness !== undefined) {
            child.material.metalness = Math.max(child.material.metalness, 0.7);
            child.material.roughness = Math.min(child.material.roughness, 0.3);
          }
        }
      }
    });

    scene.add(model);

    // Animations if any
    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach(clip => mixer.clipAction(clip).play());
    }

    // Hide loading
    document.getElementById('loading').classList.add('hidden');
  },
  (progress) => {
    const pct = Math.round((progress.loaded / progress.total) * 100);
    document.querySelector('.loading-text').textContent = `Loading ${pct}%`;
  },
  (error) => {
    console.error('GLB error:', error);
    document.querySelector('.loading-text').textContent = 'Error loading model';
  }
);

// ANIMATE
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  floatTime += delta;

  if (mixer) mixer.update(delta);
  if (model) {
    // Floating effect
    model.position.y = Math.sin(floatTime * 0.8) * 0.08;
    // Subtle tilt
    model.rotation.x = Math.sin(floatTime * 0.4) * 0.04;
  }

  // Animate point light
  pointLight.position.x = Math.sin(floatTime * 0.6) * 2;
  pointLight.position.z = Math.cos(floatTime * 0.6) * 2;

  controls.update();
  renderer.render(scene, camera);
}
animate();

// RESIZE
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
});
</script>
</body>
</html>
